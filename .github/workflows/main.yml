name: Build QwenPaw FNOS

on:
  schedule:
    - cron: '0 16 */3 * *' # 每三天 Asia/Shanghai 00:00 自动检查更新
  workflow_dispatch:
    inputs:
      force:
        description: '是否强制重新构建打包'
        required: false
        default: false
        type: boolean

env:
  TZ: Asia/Shanghai
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      need_update: ${{ steps.check_update.outputs.need_update }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Get latest official QwenPaw version
        id: version
        run: |
          RELEASE=$(curl -s -H "Authorization: token ${GH_TOKEN}" https://api.github.com/repos/agentscope-ai/QwenPaw/releases/latest )
          LATEST=$(echo "$RELEASE" | jq -r '.tag_name' | sed 's/^v//')
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest QwenPaw version: $LATEST"

      - name: Check if update needed
        id: check_update
        run: |
          # 提取当前版本
          CURRENT_VERSION=$(grep -o "更新 QwenPaw 到 v.* 版本" manifest | sed 's/更新 QwenPaw 到 v//; s/ 版本//' || echo "")
          LATEST_VERSION="${{ steps.version.outputs.version }}"
          echo "Current packaged QwenPaw version: $CURRENT_VERSION"
          echo "Latest official QwenPaw version: $LATEST_VERSION"
          
          FORCE_BUILD="${{ github.event.inputs.force }}"
          echo "Force build flag: $FORCE_BUILD"
          
          if [ "$FORCE_BUILD" = "true" ] || [ "$CURRENT_VERSION" != "$LATEST_VERSION" ]; then
            echo "need_update=true" >> $GITHUB_OUTPUT
            echo "Decision: Update required."
          else
            echo "need_update=false" >> $GITHUB_OUTPUT
            echo "Decision: No update needed."
          fi

  build:
    needs: check
    if: needs.check.outputs.need_update == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download official QwenPaw
        run: |
          mkdir -p temp
          wget "https://github.com/agentscope-ai/QwenPaw/archive/refs/tags/v${{ needs.check.outputs.version }}.zip" -O temp/QwenPaw.zip
          unzip temp/QwenPaw.zip -d temp

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: temp/QwenPaw-*/console/package-lock.json

      - name: Build frontend console
        run: |
          cd temp/QwenPaw-*/console
          npm ci
          npm run build

      - name: Copy console dist to src
        run: |
          cd temp/QwenPaw-*/
          rm -rf src/qwenpaw/console
          mkdir -p src/qwenpaw/console
          cp -R console/dist/. src/qwenpaw/console/

      - name: Copy src to /app/server
        run: |
          rm -rf app/server/src
          mkdir -p app/server/src
          cp -r temp/QwenPaw-*/src app/server/
          cp -r temp/QwenPaw-*/packages app/server/
          cp -f temp/QwenPaw-*/README.md app/server/
          cp -f temp/QwenPaw-*/pyproject.toml app/server/
          cp -f temp/QwenPaw-*/setup.py app/server/

      - name: Update manifest
        id: manifest
        run: |
          VERSION=$(date +%y.%-m.%-d)
          CHANGELOG="更新 QwenPaw 到 v${{ needs.check.outputs.version }} 版本"
          sed -i "s/^version\s*=.*/version               = ${VERSION}/" manifest
          sed -i "s|^changelog\s*=.*|changelog             = ${CHANGELOG}|" manifest
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Updated manifest:"
          grep -E "^version|^changelog" manifest

      - name: Install fnpack
        run: |
          chmod +x build/fnpack-1.2.1-linux-amd64
          sudo cp build/fnpack-1.2.1-linux-amd64 /usr/local/bin/fnpack
          
      - name: Build fpk package
        id: build
        run: |
          fnpack build
          FPK_FILE=$(ls *.fpk | head -n 1)
          echo "fpk_file=${FPK_FILE}" >> $GITHUB_OUTPUT
          echo "FPK package built: ${FPK_FILE}"
          
      - name: Upload fpk artifact
        uses: actions/upload-artifact@v4
        with:
          name: QwenPaw-${{ needs.check.outputs.version }}
          path: ${{ steps.build.outputs.fpk_file }}
          retention-days: 30

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.manifest.outputs.version }}
          name: v${{ steps.manifest.outputs.version }}
          body: "更新 QwenPaw 到 v${{ needs.check.outputs.version }} 版本"
          files: |
            ${{ steps.build.outputs.fpk_file }}
          draft: false
          prerelease: false

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add app/server/ manifest
          git commit -m "更新 QwenPaw 到 v${{ needs.check.outputs.version }} 版本" || exit 0
          git push

      - name: Update FnDepot fnpack.json
        env:
          FnDepot_TOKEN: ${{ secrets.FnDepot_TOKEN }}
          VERSION: ${{ steps.manifest.outputs.version }}
          TAG_NAME: v${{ steps.manifest.outputs.version }}
          CHANGELOG: "更新 QwenPaw 到 v${{ needs.check.outputs.version }} 版本"
        run: |
          if [ -z "$FnDepot_TOKEN" ]; then
            echo "未配置 FnDepot_TOKEN secret，跳过更新 FnDepot。"
            exit 0
          fi

          FPK_FILE="${{ steps.build.outputs.fpk_file }}"
          FPK_SIZE=$(stat -c %s "$FPK_FILE")
          FPK_SHA256=$(sha256sum "$FPK_FILE" | awk '{print $1}')
          FPK_URL="https://github.com/yuexps/QwenPaw-FNOS/releases/download/${TAG_NAME}/${FPK_FILE}"

          TARGET_REPOS=("yuexps/FnDepot")

          for REPO in "${TARGET_REPOS[@]}"; do
            REPO_DIR="repo_$(echo "$REPO" | tr '/' '_')"
            git clone "https://x-access-token:${FnDepot_TOKEN}@github.com/${REPO}.git" "$REPO_DIR" || continue
            pushd "$REPO_DIR" > /dev/null

            if [ -f "fnpack.json" ]; then
              jq --arg ver "$VERSION" \
                 --arg changelog "$CHANGELOG" \
                 --arg fpk_url "$FPK_URL" \
                 --arg fpk_sha "$FPK_SHA256" \
                 --argjson fpk_size "$FPK_SIZE" \
                 '
                 .apps["qwenpaw_yuexps"].releases[$ver] = {
                   "changelog": $changelog,
                   "packages": {
                     "all": {
                       "download_url": $fpk_url,
                       "sha256": $fpk_sha,
                       "size": $fpk_size
                     }
                   }
                 }
                 ' fnpack.json > fnpack.json.tmp && mv fnpack.json.tmp fnpack.json

              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add fnpack.json
              if ! git diff --staged --quiet; then
                git commit -m "chore: bump qwenpaw_yuexps to ${VERSION}"
                BRANCH=$(git rev-parse --abbrev-ref HEAD)
                git push "https://x-access-token:${FnDepot_TOKEN}@github.com/${REPO}.git" "$BRANCH"
              fi
            fi
            popd > /dev/null
          done
